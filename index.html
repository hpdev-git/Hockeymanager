<!doctype html>
<html lang="fi"> 
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Jääkiekkomanageri</title>
    <style>
        :root {
            color-scheme: light;
            --ink: #1b1f23;
            --muted: #5d6872;
            --line: #d9e0e6;
            --ice: #f6fafc;
            --surface: #ffffff;
            --accent: #0d6b5f;
            --accent-strong: #094b43;
            --warn: #b5452f;
            --gold: #b78b22;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: var(--ice);
            color: var(--ink);
            font-family: Arial, Helvetica, sans-serif;
        }

        button,
        input,
        select {
            font: inherit;
        }

        input {
            min-width: 0;
        }

        .overlay {
            background: linear-gradient(135deg, rgba(255,255,255,.1), rgba(255,255,255,.3));
            min-height: 100vh;
        }

        .shell {
            width: min(1180px, calc(100% - 32px));
            margin: 0 auto;
            padding: 24px 0 40px;
        }

        .topbar {
            display: flex;
            align-items: flex-end;
            justify-content: space-between;
            gap: 16px;
            padding: 0 0 18px;
            border-bottom: 1px solid var(--line);
            color: white;
        }

        h1,
        h2,
        h3,
        p {
            margin: 0;
        }

        h1 {
            font-size: clamp(1.8rem, 4vw, 3rem);
            line-height: 1;
        }

        h2 {
            font-size: 1rem;
        }

        .season {
            display: inline-flex;
            align-items: center;
            min-height: 36px;
            padding: 0 12px;
            border: 1px solid var(--line);
            background: var(--surface);
            color: var(--muted);
            font-weight: 700;
            border-radius: 4px;
        }

        #app {
            display: grid;
            gap: 18px;
            padding-top: 18px;
        }

        .summary {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 10px;
        }

        .metric,
        .panel,
        .team {
            border: 1px solid var(--line);
            background: var(--surface);
        }

        .metric {
            padding: 14px;
        }

        .label {
            display: block;
            color: var(--muted);
            font-size: 0.78rem;
            text-transform: uppercase;
        }

        .value {
            display: block;
            margin-top: 6px;
            font-size: 1.08rem;
            font-weight: 800;
        }

        .actions {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        .button {
            min-height: 40px;
            padding: 0 14px;
            border: 1px solid var(--accent);
            background: var(--accent);
            color: #ffffff;
            font-weight: 800;
            cursor: pointer;
            border-radius: 4px;
        }

            .button:hover {
                background: var(--accent-strong);
                color: white;
            }

            .button.secondary {
                background: var(--surface);
                color: var(--accent-strong);
            }

                .button.secondary:hover {
                    background: var(--accent-strong);
                    color: white;
                }

            .button.danger {
                border-color: var(--warn);
                background: var(--surface);
                color: var(--warn);
            }

                .button.danger:hover {
                    background: var(--warn);
                    color: white;
                }

            .button.stretch {
                width: 100%;
            }

            .button:disabled {
                border-color: var(--line);
                background: #edf2f5;
                color: #87939d;
                cursor: not-allowed;
            }

            .button:disabled:hover {
                background: #edf2f5;
                color: #87939d;
            }

        .layout {
            display: grid;
            grid-template-columns: minmax(0, 1fr) minmax(310px, 0.8fr);
            gap: 18px;
            align-items: start;
        }

        .schedule-panel {
            grid-row: 3;
            grid-column: 1 / span 2;
        }

        .standings-panel {
            grid-row: 1;
            grid-column: 1/ span 2;
        }

        .leaderboard-panel {
            grid-row: 2;
            grid-column: 1;
        }

        .goalie-panel {
            grid-row: 2;
            grid-column: 2;
        }

        .panel {
            min-width: 0;
        }

        .panel-head {
            display: flex;
            justify-content: space-between;
            gap: 10px;
            padding: 14px;
            border-bottom: 1px solid var(--line);
        }

        .panel-body {
            padding: 14px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th,
        td {
            padding: 10px 8px;
            border-bottom: 1px solid var(--line);
            text-align: right;
            white-space: nowrap;
        }

            th:first-child,
            td:first-child {
                text-align: left;
            }

        tr:last-child td {
            border-bottom: 0;
        }

        .table-sub {
            display: block;
            margin-top: 4px;
            color: var(--muted);
            font-size: 0.76rem;
            font-weight: 700;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .link-button {
            padding: 0;
            border: 0;
            background: transparent;
            color: var(--accent-strong);
            font-weight: 800;
            text-align: left;
            cursor: pointer;
        }

            .link-button:hover {
                text-decoration: underline;
            }

        .team-cell {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            max-width: 100%;
            min-width: 0;
        }

        .manager-star {
            flex: 0 0 auto;
            font-size: 0.9rem;
            line-height: 1;
        }

        .metric-link {
            max-width: 100%;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .schedule {
            display: grid;
            gap: 8px;
            max-height: 480px;
            overflow: auto;
        }

        .game {
            display: grid;
            grid-template-columns: 52px minmax(0, 1fr) auto;
            gap: 10px;
            align-items: center;
            padding: 10px;
            border: 1px solid var(--line);
        }

        .game-details {
            grid-column: 2 / -1;
            display: grid;
            gap: 4px;
            color: var(--muted);
            font-size: 0.78rem;
            line-height: 1.35;
        }

        .game.next {
            border-color: var(--accent);
            background: #eef8f5;
        }

        .round {
            color: var(--muted);
            font-size: 0.82rem;
            font-weight: 800;
        }

        .matchup {
            min-width: 0;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .score {
            min-width: 54px;
            color: var(--accent-strong);
            font-weight: 900;
            text-align: right;
        }

        .teams {
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            gap: 10px;
        }

        .team {
            display: grid;
            gap: 10px;
            padding: 12px;
        }

        .team-select {
            align-content: start;
        }

        .team-title {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 8px;
        }

        .swatch {
            width: 100%;
            height: 8px;
            background: linear-gradient(90deg, var(--team-primary), var(--team-secondary));
        }

        .team h3 {
            font-size: 0.98rem;
            line-height: 1.2;
        }

        .ratings {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 6px;
            color: var(--muted);
            font-size: 0.78rem;
        }

            .ratings strong {
                display: block;
                color: var(--ink);
                font-size: 0.96rem;
            }

        .muted {
            color: var(--muted);
            line-height: 1.45;
        }

        .badge {
            display: inline-flex;
            align-items: center;
            min-height: 24px;
            padding: 0 8px;
            border: 1px solid color-mix(in srgb, var(--team-primary), #ffffff 45%);
            background: color-mix(in srgb, var(--team-primary), #ffffff 88%);
            color: var(--accent-strong);
            font-size: 0.75rem;
            font-weight: 900;
            white-space: nowrap;
        }

        .manager-select {
            display: grid;
            gap: 18px;
        }

        .select-copy {
            display: grid;
            gap: 8px;
            max-width: 720px;
        }

        .manager-name-field {
            display: grid;
            gap: 8px;
            max-width: 420px;
        }

        .field-label {
            color: #000;
            font-size: 0.78rem;
            font-weight: 800;
            text-transform: uppercase;
        }

        .text-input {
            width: 100%;
            min-height: 42px;
            padding: 0 12px;
            border: 1px solid var(--line);
            background: var(--surface);
            color: var(--ink);
            font-weight: 800;
        }

            .text-input:focus {
                border-color: var(--accent);
                outline: 2px solid #cfe9e4;
                outline-offset: 0;
            }

        .select-copy h2,
        .detail-title h2 {
            font-size: clamp(1.45rem, 3vw, 2.2rem);
        }

        .team-detail {
            display: grid;
            gap: 18px;
            border: 1px solid var(--line);
            background: var(--surface);
            padding: 16px;
            border-radius: 4px;
        }

        .league-logo {
            width: 75px;
        }

        .detail-hero {
            display: grid;
            grid-template-columns: minmax(0, 1fr) auto;
            gap: 14px;
            align-items: start;
        }

            .detail-hero .swatch {
                grid-column: 1 / -1;
            }

        .detail-title {
            display: grid;
            gap: 6px;
        }

        .detail-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
            gap: 10px;
        }

            .detail-grid.player-skills {
                display: flex;
            }

        .info-item {
            min-height: 74px;
            padding: 12px;
            border: 1px solid var(--line);
            background: #fbfdfe;
        }

            .info-item strong {
                display: block;
                margin-top: 6px;
                line-height: 1.25;
            }

        .detail-grid.player-skills .info-item {
            flex-basis: 0;
            flex-grow: 1;
        }

            .detail-grid.player-skills .info-item strong {
                text-align: center;
            }

        .info-link {
            display: block;
            margin-top: 6px;
            line-height: 1.25;
        }

        .rating-band {
            padding: 12px;
            border: 1px solid var(--line);
        }

        .roster-section {
            display: grid;
            gap: 10px;
            padding-top: 4px;
        }

        .roster-group {
            display: grid;
            gap: 8px;
        }

        .section-head.compact {
            min-height: 24px;
        }

            .section-head.compact h2 {
                font-size: 0.92rem;
            }

        .muted-count {
            color: var(--muted);
            font-size: 0.82rem;
            font-weight: 800;
        }

        .player-list {
            display: grid;
            gap: 6px;
        }

        .player-row {
            display: grid;
            grid-template-columns: minmax(0, 1fr) auto;
            gap: 10px;
            align-items: center;
            padding: 9px 10px;
            border: 1px solid var(--line);
            background: #fbfdfe;
        }

        .player-main {
            display: grid;
            gap: 3px;
            min-width: 0;
        }

            .player-main strong,
            .player-link,
            .player-main span {
                min-width: 0;
                overflow: hidden;
                text-overflow: ellipsis;
                white-space: nowrap;
            }

        .player-link {
            display: block;
        }

        .player-main span {
            color: var(--muted);
            font-size: 0.8rem;
            font-weight: 700;
        }

        .player-meta {
            color: var(--accent-strong);
            font-size: 0.78rem;
            font-weight: 900;
            white-space: nowrap;
        }

        .history-list {
            display: grid;
            gap: 8px;
        }

        .history-section {
            display: grid;
            gap: 10px;
            padding-top: 4px;
        }

        .section-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            min-height: 32px;
        }

        .history-row {
            display: grid;
            grid-template-columns: 10px auto auto;
            gap: 10px;
            align-items: center;
            padding: 10px;
            border: 1px solid var(--line);
        }

        .history-swatch {
            width: 10px;
            height: 28px;
            background: linear-gradient(180deg, var(--team-primary), var(--team-secondary));
        }

        .season-pill {
            color: var(--muted);
            font-size: 0.82rem;
            font-weight: 900;
            white-space: nowrap;
            text-align: right;
        }

        .history-team {
            min-width: 0;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .history-points {
            color: var(--accent-strong);
            font-weight: 900;
            white-space: nowrap;
        }

        .empty-state {
            padding: 12px;
            border: 1px solid var(--line);
            color: var(--muted);
            background: #fbfdfe;
        }

        @media (max-width: 860px) {
            .summary,
            .layout,
            .teams {
                grid-template-columns: 1fr;
            }

            .topbar {
                align-items: flex-start;
                flex-direction: column;
            }

            .standings-panel {
                grid-row: auto;
            }
        }

        @media (max-width: 520px) {
            .shell {
                width: min(100% - 20px, 1180px);
                padding-top: 16px;
            }

            th,
            td {
                padding: 8px 5px;
                font-size: 0.86rem;
            }

            .game {
                grid-template-columns: 44px minmax(0, 1fr);
            }

            .score {
                grid-column: 2;
                text-align: left;
            }

            .game-details {
                grid-column: 1 / -1;
            }

            .detail-hero {
                grid-template-columns: 1fr;
            }

            .history-points {
                grid-column: 3;
            }

            .player-row {
                grid-template-columns: 1fr;
            }

            .player-meta {
                white-space: normal;
            }
        }
    </style>
</head>
  <body>
      <div class="overlay">
          <main class="shell">
              <header class="topbar">
                  <h1>Jääkiekkomanageri</h1>
                  <div class="season" id="season-status">Kausi 1</div>
              </header>
              <section id="app" aria-live="polite"></section>
          </main>
      </div>
    <script src="js/data/coaches.js" type="text/javascript" charset="utf-8"></script>
    <script src="js/data/players.js" type="text/javascript" charset="utf-8"></script>
    <script src="js/data/seeds.js" type="text/javascript" charset="utf-8"></script>
    <script src="js/core/schedule.js" type="text/javascript" charset="utf-8"></script>
    <script src="js/core/simulator.js" type="text/javascript" charset="utf-8"></script>
    <script src="js/core/standings.js" type="text/javascript" charset="utf-8"></script>
    <script src="js/core/player-stats.js" type="text/javascript" charset="utf-8"></script>
    <script src="js/core/game-state.js" type="text/javascript" charset="utf-8"></script>
    <script src="js/core/storage.js" type="text/javascript" charset="utf-8"></script>
    <script src="js/ui/render.js" type="text/javascript" charset="utf-8"></script>
    <script src="js/app.js" type="text/javascript" charset="utf-8"></script>
  </body>
</html>
